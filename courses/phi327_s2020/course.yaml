course:
  code: "PHI 327"
  title: "Philosophy of Physics"
  term: "Spring 2020"
  university: "Princeton University"

  description: >
    An introduction to philosophical issues arising in classical and quantum physics,
    including space and time, causality, realism, measurement, and the interpretation
    of quantum mechanics.

