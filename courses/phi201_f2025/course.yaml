course:
  code: "PHI 201"
  title: "Introductory Logic"
  term: "Fall 2025"
  university: "Princeton University"

  description: >
    An introduction to formal logic, covering propositional and predicate logic,
    natural deduction, truth tables, models, and metatheory, with applications to
    philosophical reasoning.

  navigation:
    - id: home
      label: Home
      path: index.html
    - id: lectures
      label: Lectures
      path: lectures.html
    - id: psets
      label: Psets
      path: psets.html
    - id: precepts
      label: Precepts
      path: precepts.html
    - id: exams
      label: Exams
      path: exams.html
    - id: resources
      label: Resources
      path: resources.html

schedule:
  lectures:
    days: ["Monday"]
    time: "1:20-2:40"
    location: "Frick B01"

  precepts:
    days: ["Wednesday"]

  psets:
    due:
      day: "Friday"
      time: "17:00"

staff:
  instructors:
    - name: "Hans Halvorson"
      role: "Course Instructor"
      email: "hhalvors@princeton.edu"

  preceptors:
